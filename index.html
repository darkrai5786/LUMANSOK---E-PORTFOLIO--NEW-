<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site">

    <header>
        <img id="logo" src="assets/images/logo1.jpg" alt="">
        <div>
            <h1>Welcome to my Portfolio!</h1>
            <p>Skills and self-made projects</p>
        </div>
    </header>

    <div id="layout">

        <nav>
            <div class="group">
        
                <a href="#about" class="active">About Me</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contacts</a>
            </div>
            <img id="side-img" src="assets/images/elfen.webp" alt="">
        </nav>

        <main>
            <section id="about">
                <h2>About Me</h2>
                <div class="panel">
                    <img class="banner" src="assets/images/banner.png" alt="">
                    <p>Write about yourself here. <a href="#">Links turn green.</a></p>
                </div>
            </section>

            <section id="projects">
                <h2>Projects</h2>
                <div class="panel" id="project-card">
                    <img id="project-img" src="" alt="">
                    <div>
                        <h3 id="project-title"></h3>
                        <p id="project-desc"></p>
                    </div>
                    <button id="next-btn" aria-label="Next project"></button>
                </div>
            </section>

            <section id="contact">
                <h2>Contact Me</h2>
                <div class="panel">
                    <p>email@example.com</p>
                </div>
            </section>

        </main>
    </div>

</div>


<script src="script.js"></scripts>
</body>
</html>
